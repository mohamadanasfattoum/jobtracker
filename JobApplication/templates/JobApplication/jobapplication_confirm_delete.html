{% extends "base.html" %}

{% block content %}

<div class="delete-box">
    <h2>Bewerbung löschen</h2>

    <p>
        Möchtest du die Bewerbung
        <strong>{{ object.company_name }} - {{ object.job_title }}</strong>
        wirklich löschen?
    </p>

    <p class="warning-text">
        Diese Aktion kann nicht rückgängig gemacht werden.
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-delete">Ja, löschen</button>
        <a class="btn btn-secondary" href="{% url 'application_list' %}">Abbrechen</a>
    </form>
</div>

{% endblock %}
